# Escala de Notas para Windows 10/11 (WebView2) — lo usa herramientas/winhost/construir.sh
NOMBRE="Escala de Notas"
EXE=EscalaNotas
VERSION=1.1.0
DESCRIPCION="Escala de notas para el cálculo de notas escolares en Chile"
ARCHIVOS_EXTRA='  File /r "..\dist\ui"'
copiar_extra() { rm -rf "$1/ui"; cp -r "$W/../ui" "$1/ui"; rm -f "$1"/ui/*.bak*; }
