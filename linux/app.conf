# Escala de Notas — configuración de empaquetado Linux (la usa herramientas/linux-pkg/empaquetar.sh)
APP_ID=io.github.navarretenoir.EscalaNotas
PAQUETE=escala-notas
NOMBRE="Escala de Notas"
NOMBRE_ARCHIVO=EscalaNotas
VERSION=$(cat "$APP/VERSION")
BIN_GUI=escala-notas
RESUMEN="Escala de notas para el cálculo de notas escolares en Chile (1,0 a 7,0)"
DESCRIPCION="Calcula la escala de notas chilena de 1,0 a 7,0 con cualquier exigencia y puntaje, las notas de un curso completo con promedio y distribución, y exporta a PDF, Excel, Word, CSV e imagen. Sin internet."
DEPS_RPM="gtk4, webkitgtk6.0, json-glib"
DEPS_DEB="libgtk-4-1, libwebkitgtk-6.0-4, libjson-glib-1.0-0"
FLATPAK_EXTRA=""
SNAP_EXTRA=""
compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/desktop/." "$w/"; rm -f "$w/escala-notas"
  make -s -C "$w" UI_DIR="$pre/share/escala-notas/ui" >/dev/null; strip "$w/escala-notas"; cp "$w/escala-notas" "$out/"
  rm -rf "$w"
}
instalar() {
  install -Dm755 "$3/escala-notas" "$1$2/bin/escala-notas"
  mkdir -p "$1$2/share/escala-notas"; cp -r "$APP/ui" "$1$2/share/escala-notas/"; rm -f "$1$2/share/escala-notas/ui/"*.bak*
}
appimage_entorno() { echo 'export ESCALA_UI="$HERE/usr/share/escala-notas/ui"'; }
